<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TECHMART</title>
  <link href="output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

  <!-- القائمة العلوية -->
  <nav class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="bg-yellow-400 bg-opacity-30 p-1 rounded inline-block">
        <img src="logo.png" alt="شعار الموقع" class="h-12 w-auto" />
      </a>

      <ul class="flex justify-center space-x-8 rtl:space-x-reverse text-yellow-500 font-bold text-lg flex-1">
        <li><a href="#" class="hover:text-yellow-600 transition">الرئيسية</a></li>
        <li><a href="#" class="hover:text-yellow-600 transition">المنتجات</a></li>
        <li><a href="#" class="hover:text-yellow-600 transition">حول</a></li>
        <li><a href="#" class="hover:text-yellow-600 transition">تواصل معنا</a></li>
      </ul>
    </div>
  </nav>

  <!-- واجهة الهيرو -->
  <section class="relative h-[80vh] flex items-center justify-center text-center text-white overflow-hidden my-4">
    <div id="hero-slider" class="absolute inset-0 z-0 bg-cover bg-center transition-all duration-1000"></div>
    <div class="relative z-10 bg-black/60 p-8 rounded-lg max-w-3xl">
      <h1 class="text-4xl md:text-5xl font-extrabold mb-4">اكتشف أفضل منتجاتنا</h1>
      <p class="text-lg md:text-xl text-gray-200 mb-6">تسوّق الآن واستمتع بأفضل العروض والتقييمات</p>
    </div>
  </section>

  <!-- معرض المنتجات السلايدر -->
  <main class="max-w-7xl mx-auto px-4 py-12 relative">
    <button id="prevBtn" aria-label="السابق" class="absolute top-1/2 -translate-y-1/2 right-0 bg-yellow-400 text-white p-3 rounded-l hover:bg-yellow-500 shadow-lg z-20">
      &#10094;
    </button>
    <button id="nextBtn" aria-label="التالي" class="absolute top-1/2 -translate-y-1/2 left-0 bg-yellow-400 text-white p-3 rounded-r hover:bg-yellow-500 shadow-lg z-20">
      &#10095;
    </button>

    <div id="product-slider" class="flex space-x-6 rtl:space-x-reverse overflow-x-auto scroll-smooth scrollbar-hide snap-x snap-mandatory py-4">
    </div>
  </main>

  <!-- النافذة المنبثقة Modal -->
  <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-lg max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-xl relative p-6">
      <button id="modalClose" aria-label="إغلاق" class="absolute top-4 left-4 text-gray-500 hover:text-gray-700 text-3xl font-bold">&times;</button>

      <div class="flex flex-col md:flex-row gap-6">
        <img id="modalImage" src="" alt="صورة المنتج" class="max-w-xs mx-auto rounded shadow-md object-cover" />
        
        <div class="flex-1 flex flex-col justify-between">
          <div>
            <h2 id="modalName" class="text-3xl font-bold mb-2"></h2>
            <h3 id="modalCompany" class="text-xl text-gray-600 mb-4"></h3>
            <p id="modalDescription" class="text-gray-700 mb-6"></p>
          </div>

          <div>
            <div class="mb-4 flex items-center gap-3">
              <span class="text-2xl font-semibold text-yellow-600" id="modalPrice"></span>
              <span id="modalCoupon" class="bg-yellow-200 text-yellow-800 px-2 py-1 rounded font-semibold text-sm"></span>
            </div>

            <!-- حاوية النجوم التفاعلية -->
            <div class="flex space-x-1 rtl:space-x-reverse text-3xl select-none" id="modalStars"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- التذييل -->
  <footer class="bg-white border-t mt-12 py-6 text-center text-gray-500">
    &copy; 2026 جميع الحقوق محفوظة. بواسطة أكرم الشميري
  </footer>

  <script src="script.js"></script>
</body>
</html>
